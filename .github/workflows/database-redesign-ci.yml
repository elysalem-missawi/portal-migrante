name: Database redesign CI

on:
  push:
    branches:
      - database-redesign
  pull_request:
    paths:
      - "portal-migrante/backend/**"
      - "portal-migrante/frontend/**"
      - ".github/workflows/database-redesign-ci.yml"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            portal-migrante/backend/package-lock.json
            portal-migrante/frontend/package-lock.json

      - name: Install backend
        run: npm ci
        working-directory: portal-migrante/backend

      - name: Check backend types
        run: npm run typecheck
        working-directory: portal-migrante/backend

      - name: Build backend
        run: npm run build
        working-directory: portal-migrante/backend

      - name: Install frontend
        run: npm ci
        working-directory: portal-migrante/frontend

      - name: Check frontend types
        run: npm run typecheck
        working-directory: portal-migrante/frontend

      - name: Build frontend
        run: npm run build
        working-directory: portal-migrante/frontend
